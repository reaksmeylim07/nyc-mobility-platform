[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-mobility"
version = "0.1.0"
description = "Data platform for NYC taxi and for-hire vehicle trip data"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "psycopg[binary]==3.2.3",
    "boto3==1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_mobility"]     # tells the build tool where the package lives