[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-mobility"
version = "0.1.0"
description = "Data platform for NYC taxi and for-hire vehicle trip data"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pyarrow>=17"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_mobility"]     # tells the build tool where the package lives

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: basic style errors
    "F",   # pyflakes: unused imports, undefined names (real bugs)
    "I",   # isort: import ordering
    "B",   # bugbear: common bug patterns
    "UP",  # pyupgrade: use modern Python syntax
]
