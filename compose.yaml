x-airflow-common: &airflow-common
  image: nyc-mobility-airflow:local
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["airflow"]                  # only starts with: --profile airflow
  environment: &airflow-env
    # --- Airflow itself ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # LOCAL ONLY: no login screen
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # --- our pipeline (same settings as the ingestion service) ---
    PIPELINE_ENV: dev
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    S3_ENDPOINT_URL: http://object-store:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET}
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags     # bind mount: DAG edits apply instantly
    - airflow-logs:/opt/airflow/logs
services:

  object-store-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /data && echo 'permissions fixed'"]
    volumes:
      - s3data:/data

  object-store:
    image: rustfs/rustfs:1.0.1             # pinned; S3-compatible, local dev only
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"   # single-disk laptop setup; never in production
    ports:
      - "9000:9000"     # S3 API (what code talks to)
      - "9001:9001"     # web console (what you look at)
    volumes:
      - s3data:/data
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"                       # Mac:container, for your SQL client
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s                        # ask every 5 seconds
      timeout: 3s
      retries: 10                         # give up after 10 failed checks

  ingestion:
    build:
      context: .                          # same as the "." in docker build
      dockerfile: docker/ingestion/Dockerfile
    environment:
      PIPELINE_ENV: dev
      POSTGRES_HOST: postgres             # the SERVICE NAME, not localhost
      POSTGRES_PORT: "5432"               # the CONTAINER port, not 5433
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT_URL: http://object-store:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      TLC_DATASET: yellow_tripdata
      TLC_MONTH: "2024-01"
    depends_on:
      postgres:
        condition: service_healthy        # wait for "ready", not just "started"
      object-store:
        condition: service_healthy
  airflow-db:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    user: "0:0"                          # root, only to fix log-folder ownership
    entrypoint: /bin/bash
    command: ["-c", "chown -R 50000:0 /opt/airflow/logs && exec /entrypoint airflow version"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"        # create/upgrade Airflow's metadata tables
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:                                 # declare the named volume
  s3data:
  airflow-db-data:
  airflow-logs:
